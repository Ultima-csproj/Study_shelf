[workspace]
members = [
    "crates/study-core",
    "crates/study-storage-sqlite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

sqlx = {version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"]}

[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
study-core = { path = "crates/study-core" }
study-storage-sqlite = { path = "crates/study-storage-sqlite" }
tokio.workspace = true
sqlx.workspace = true
