[workspace]
members = [
    "crates/study-core",
    "crates/study-storage-sqlite",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"]}

sqlx = {version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"]}

[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
sqlx.workspace = true

study-core = { path = "crates/study-core"}
study-storage-sqlite = { path = "crates/study-storage-sqlite"}

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
tower-http = { version = "0.7", features = ["trace"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"]}

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
