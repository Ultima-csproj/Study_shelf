[workspace]
members = ["crates/study-core", "crates/study-storage-postgres"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
thiserror = "2"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "tls-rustls", "postgres", "time", "json"] }

[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
sqlx.workspace = true
time.workspace = true
thiserror.workspace = true
dotenvy = "0.15"
study-core = { path = "crates/study-core" }
study-storage-postgres = { path = "crates/study-storage-postgres" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
